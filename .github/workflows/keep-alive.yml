name: Keep Backend Alive

on:
  schedule:
    # Run every 14 minutes (Render sleeps after 15 minutes of inactivity)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          echo "Pinging MediAudit AI backend on Render..."
          curl -s -f -m 30 https://mediaudit-ai-gcxb.onrender.com/api/health || echo "Ping dispatched"
